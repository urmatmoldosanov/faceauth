server {
    listen 80;
    server_name faceauth-backend.local;

    root /var/www/faceauth-backend/public;
    index api.php index.php;

    access_log /var/log/nginx/faceauth-backend.access.log;
    error_log /var/log/nginx/faceauth-backend.error.log;

    client_max_body_size 8m;

    location = /health {
        try_files /api.php =404;
    }

    location = /license/status {
        try_files /api.php =404;
    }

    location = /snapshot {
        try_files /api.php =404;
    }

    location = /violation {
        try_files /api.php =404;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
    }

    location ~ /\. {
        deny all;
    }
}
