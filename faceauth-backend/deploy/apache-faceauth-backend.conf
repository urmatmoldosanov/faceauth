<VirtualHost *:80>
    ServerName faceauth-backend.local
    DocumentRoot /var/www/faceauth-backend/public

    <Directory /var/www/faceauth-backend/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/faceauth-backend>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/faceauth-backend.error.log
    CustomLog ${APACHE_LOG_DIR}/faceauth-backend.access.log combined
</VirtualHost>
