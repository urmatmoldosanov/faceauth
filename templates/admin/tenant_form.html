{% extends "admin/base.html" %}
{% block content %}
<h1 class="h3 mb-3">Create tenant</h1>
<div class="card shadow-sm"><div class="card-body">
<form method="post" action="/admin/tenants/create">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label" for="tenant_id">ID</label><input class="form-control" id="tenant_id" name="tenant_id" required></div>
    <div class="col-md-6"><label class="form-label" for="name">Name</label><input class="form-control" id="name" name="name" required></div>
    <div class="col-md-6"><label class="form-label" for="domain">Domain</label><input class="form-control" id="domain" name="domain" required></div>
    <div class="col-md-3"><label class="form-label" for="max_students">Max students</label><input class="form-control" id="max_students" name="max_students" type="number" min="0" value="0" required></div>
    <div class="col-md-3"><label class="form-label" for="max_sessions">Max sessions</label><input class="form-control" id="max_sessions" name="max_sessions" type="number" min="0" value="0" required></div>
  </div>
  <div class="mt-4"><button class="btn btn-primary" type="submit">Create</button> <a class="btn btn-secondary" href="/admin/tenants">Cancel</a></div>
</form>
</div></div>
{% endblock %}
