{% extends "admin/base.html" %}
{% block content %}
<h1 class="h3 mb-3">Verifications</h1>
<div class="card shadow-sm"><div class="table-responsive">
<table class="table table-striped table-hover mb-0"><thead><tr><th>ID</th><th>Session token</th><th>Result</th><th>Score</th><th>Timestamp</th></tr></thead><tbody>
{% for item in verifications %}
<tr><td>{{ item.id }}</td><td><code>{{ item.session_token }}</code></td><td>{{ item.result }}</td><td>{{ item.score }}</td><td>{{ item.timestamp }}</td></tr>
{% else %}<tr><td colspan="5" class="text-muted">No verifications found.</td></tr>{% endfor %}
</tbody></table>
</div></div>
{% endblock %}
