<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/admin/dashboard">FaceAuth Core Admin</a>
    {% if csrf_token is defined %}
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbar" aria-controls="adminNavbar" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="adminNavbar">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="/admin/dashboard">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/tenants">Tenants</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/licenses">Licenses</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/sessions">Sessions</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/verifications">Verifications</a></li>
      </ul>
      <a class="btn btn-outline-light btn-sm" href="/admin/logout">Logout</a>
    </div>
    {% endif %}
  </div>
</nav>
<main class="container-fluid pb-5">
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function copyById(elementId) {
  const el = document.getElementById(elementId);
  if (!el) return;
  el.select();
  el.setSelectionRange(0, 99999);
  navigator.clipboard.writeText(el.value);
}
</script>
</body>
</html>
